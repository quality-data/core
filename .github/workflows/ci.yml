name: CI

# Lint + test + build for the quality-data core monorepo. The pipeline is split into a
# Rust `backend` job and a pnpm `frontend` job, and the `check` job gates each
# so a PR that only touches one stack never compiles the other. Dependency
# caches (cargo + pnpm) keep repeat runs fast.
#
# GitHub's minutes are counted per job and rounded up to the minute: the light
# work (what changed, secrets, audit) goes together in `check`, and the heavy
# work (`backend`, `frontend`) runs where the repository variable `CI_RUNNER`
# says — `["self-hosted","linux","x64","orq"]` with the ephemeral runners of
# infra/aws/ci; without it, on GitHub's.

on:
  # Only on PRs: they are merged rebased onto main and with a green CI, so what
  # reaches main is already tested (running it again was 35 % of the minutes).
  pull_request:
  # Weekly re-audit of dependencies: a vulnerability disclosed against an
  # unchanged dependency is caught even when no one pushes.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. a new push to an open PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which stacks the PR touches (to skip the heavy jobs that it does not), the
  # secret scan and the dependency audit, in a single job: each job costs at
  # least a minute.
  check:
    # CI_RUNNER_LIVIANO (like CI_RUNNER) sends it to the AWS runners when
    # GitHub has no minutes; without it, on GitHub's.
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LIVIANO || '"ubuntu-latest"') }}
    # On a PR, paths-filter asks GitHub's API for the list of files.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      image-api: ${{ steps.filter.outputs.image-api }}
      image-web: ${{ steps.filter.outputs.image-web }}
      image-worker: ${{ steps.filter.outputs.image-worker }}
      image-lake-rustfs-admin: ${{ steps.filter.outputs.image-lake-rustfs-admin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks scans every commit, not just the tip.
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            backend:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - 'openapi.json'
              - 'packages/api-client/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'eslint.config.js'
              - '.prettierrc.json'
              - '.prettierignore'
              - '.npmrc'
              - 'infra/observability/grafana/**'
              - 'tools/grafana/**'
              - 'crates/quality/charts/**'
              - 'crates/quality/src/charts.rs'
              - '.github/workflows/ci.yml'
            # What goes into each image: a broken Dockerfile fails the PR. The
            # API's and the web's report version.txt's version.
            image-api:
              - 'infra/docker/api.Dockerfile'
              - 'version.txt'
              - '.dockerignore'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            # The worker links the crates it reads sources and the lake with:
            # any crate can change it, as for the API.
            image-worker:
              - 'infra/docker/worker.Dockerfile'
              - '.dockerignore'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            # The lake admin adapter (decision 0078) links contracts alone
            # among the core's crates.
            image-lake-rustfs-admin:
              - 'infra/docker/lake-rustfs-admin.Dockerfile'
              - '.dockerignore'
              - 'crates/lake-rustfs-admin/**'
              - 'crates/contracts/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            image-web:
              - 'infra/docker/web.Dockerfile'
              - 'version.txt'
              - 'infra/web/**'
              - '.dockerignore'
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - '.github/workflows/ci.yml'
            dependencies:
              - 'Cargo.lock'
              - 'deny.toml'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

      # Secret scan: gitleaks over the full history, ungated — a secret can be
      # introduced in any file. Fake credentials in tests and .env.example are
      # allowlisted in .gitleaks.toml.
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

      # Dependency vulnerability audit: when a PR changes the dependencies, and
      # every week (a CVE can be disclosed against an unchanged dependency).
      # Justified, dated exceptions live in deny.toml (Rust) and pnpm's audit
      # config (JS); see deny.toml for the process.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        if: github.event_name != 'pull_request' || steps.filter.outputs.dependencies == 'true'
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        if: github.event_name != 'pull_request' || steps.filter.outputs.dependencies == 'true'
        with:
          tool: cargo-deny
      - name: cargo-deny (advisories)
        if: github.event_name != 'pull_request' || steps.filter.outputs.dependencies == 'true'
        run: cargo deny check advisories
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: github.event_name != 'pull_request' || steps.filter.outputs.dependencies == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'pull_request' || steps.filter.outputs.dependencies == 'true'
        with:
          node-version: 22
      - name: pnpm audit (high+critical)
        if: github.event_name != 'pull_request' || steps.filter.outputs.dependencies == 'true'
        # It audits the lockfile: nothing needs installing.
        run: pnpm audit --audit-level high

  # Rust backend: format, lint, test, build across the whole Cargo workspace.
  # Also the API's contract: it regenerates the OpenAPI spec from the backend
  # and the TypeScript client from the spec, and fails if they differ from
  # what is in the repository (with the same build).
  backend:
    needs: check
    if: ${{ needs.check.outputs.backend == 'true' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    env:
      # In CI incremental builds and debug info are no use: they only take
      # disk (and cache).
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      # A new migration only adds: if an update does not start, the previous
      # version comes back over the already migrated database.
      - name: Migrations (expand/contract)
        run: cargo xtask migrations
      # No file past its hard limit: Rust 800 lines, TypeScript 600 (0034).
      # Functions are checked by Clippy and ESLint.
      - name: File sizes
        run: cargo xtask sizes
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The contract tier A (decision 0090, step 9): the same SQL on DuckDB
      # and on Trino 484, which runs RE2J. One node, no lake; removed below.
      - name: Start Trino for the contract tier A
        run: |
          mkdir -p "$RUNNER_TEMP/trino"
          printf '%s\n' coordinator=true node-scheduler.include-coordinator=true \
            http-server.http.port=8080 discovery.uri=http://localhost:8080 \
            regex-library=RE2J > "$RUNNER_TEMP/trino/config.properties"
          docker run -d --name "qd-ci-trino-${{ github.run_id }}" --memory 3g \
            -p 127.0.0.1:18484:8080 \
            -v "$RUNNER_TEMP/trino/config.properties:/etc/trino/config.properties:ro" \
            trinodb/trino:484
          for _ in $(seq 1 90); do
            if curl -sf http://127.0.0.1:18484/v1/info | grep -q '"starting":false'; then exit 0; fi
            sleep 2
          done
          docker logs "qd-ci-trino-${{ github.run_id }}" | tail -40
          exit 1
      - name: Test
        run: cargo test --workspace --locked
        env:
          QD_TRINO_URL: http://127.0.0.1:18484
      - name: Remove Trino
        if: always()
        run: docker rm -f "qd-ci-trino-${{ github.run_id }}" || true
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Regenerate the API spec and client
        run: pnpm run gen:api
      - name: Fail if the spec or client is out of date
        run: git diff --exit-code -- openapi.json packages/api-client/src/schema.ts

  # pnpm frontend: lint, prettier check, test, build across the pnpm workspace.
  frontend:
    needs: check
    if: ${{ needs.check.outputs.frontend == 'true' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # action-setup reads the pinned pnpm version from package.json
      # (packageManager) and must run before setup-node so the pnpm store cache
      # can resolve.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Format check
        run: pnpm run format:check
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm run build
      # Generated from infra/observability/grafana/definition; fails on a
      # changed or new file the commit does not carry.
      - name: Fail if the Grafana dashboards are out of date
        run: pnpm run check:grafana

  # The images, built as a release builds them but not pushed: a Dockerfile
  # that no longer matches the workspace fails here, not at release time.
  # Each is kept as a workflow artifact for a week (decision 0082), for the
  # verifications and the test installation, until a release pushes them;
  # a manual run (workflow_dispatch) builds all three from its ref.
  # On GitHub's runners (they have Docker), with no secrets: the token only
  # reads.
  #
  # The API image has no Actions cache: a release build with DuckDB would add
  # gigabytes to the repository's 10 GB and evict the backend's Rust caches.
  # It only has to prove the image builds, and runs only when its inputs
  # change. The runner's disk is freed first: a release build with DuckDB can
  # need more than the free space an ubuntu-latest runner starts with.
  image-api:
    needs: check
    if: ${{ needs.check.outputs.image-api == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "$RUNNER_TOOL_CACHE"
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The version it reports is the module's (version.txt), as the update
      # agent checks it, and its commit the one built.
      - name: The version to build
        id: version
        run: echo "version=$(tr -d '[:space:]' < version.txt)" >> "$GITHUB_OUTPUT"
      - name: Build the API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          tags: qd-api:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/qd-api.tar
      # Kept for a week (decision 0082): `gh run download -n image-api`,
      # then `docker load -i qd-api.tar`.
      - name: Keep the API image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-api
          path: ${{ runner.temp }}/qd-api.tar
          retention-days: 7
          if-no-files-found: error

  # The worker's image, as the API's: a release build with DuckDB, so no
  # Actions cache and the disk freed first. It also installs DuckDB's
  # extensions and checks each source driver's SHA-256, failing on a
  # mismatch.
  image-worker:
    needs: check
    if: ${{ needs.check.outputs.image-worker == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "$RUNNER_TOOL_CACHE"
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          push: false
          tags: qd-worker:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/qd-worker.tar
      # Kept for a week (decision 0082): `gh run download -n image-worker`,
      # then `docker load -i qd-worker.tar`.
      - name: Keep the worker image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-worker
          path: ${{ runner.temp }}/qd-worker.tar
          retention-days: 7
          if-no-files-found: error

  # The lake admin adapter's image (decision 0078, step 13), as the
  # worker's: built and kept, never pushed (it reaches ECR from the
  # lake-rustfs repository, step 15).
  image-lake-rustfs-admin:
    needs: check
    if: ${{ needs.check.outputs.image-lake-rustfs-admin == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the lake admin adapter's image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/lake-rustfs-admin.Dockerfile
          push: false
          tags: qd-lake-rustfs-admin:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/qd-lake-rustfs-admin.tar
      # Kept for a week (decision 0082): `gh run download -n
      # image-lake-rustfs-admin`, then `docker load -i qd-lake-rustfs-admin.tar`.
      - name: Keep the lake admin adapter's image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-lake-rustfs-admin
          path: ${{ runner.temp }}/qd-lake-rustfs-admin.tar
          retention-days: 7
          if-no-files-found: error

  # The web image keeps a small Actions cache (about 180 MB), deleted with the
  # PR's other caches when it closes (cache-cleanup.yml).

  image-web:
    needs: check
    if: ${{ needs.check.outputs.image-web == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The version it reports is the module's (version.txt), as the update
      # agent checks it, and its commit the one built.
      - name: The version to build
        id: version
        run: echo "version=$(tr -d '[:space:]' < version.txt)" >> "$GITHUB_OUTPUT"
      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          tags: qd-web:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/qd-web.tar
          cache-from: type=gha,scope=image-web
          cache-to: type=gha,scope=image-web,mode=max
      # Kept for a week (decision 0082): `gh run download -n image-web`,
      # then `docker load -i qd-web.tar`.
      - name: Keep the web image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-web
          path: ${{ runner.temp }}/qd-web.tar
          retention-days: 7
          if-no-files-found: error

  # Single required status check for branch protection: green when every
  # affected job passed. Skipped stacks (unaffected) do not fail the gate.
  ci:
    if: always()
    needs: [check, backend, frontend, image-api, image-web, image-worker, image-lake-rustfs-admin]
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LIVIANO || '"ubuntu-latest"') }}
    steps:
      - name: Aggregate result
        run: |
          # What changed, the secrets and the audit always run and must pass.
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "check job did not succeed"; exit 1
          fi
          for stack in backend frontend image-api image-web image-worker image-lake-rustfs-admin; do
            case "$stack" in
              backend) result="${{ needs.backend.result }}" ;;
              frontend) result="${{ needs.frontend.result }}" ;;
              image-api) result="${{ needs.image-api.result }}" ;;
              image-web) result="${{ needs.image-web.result }}" ;;
              image-worker) result="${{ needs.image-worker.result }}" ;;
              image-lake-rustfs-admin) result="${{ needs.image-lake-rustfs-admin.result }}" ;;
            esac
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "$stack job $result"; exit 1
            fi
          done
          echo "CI passed"
